# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Generate SLSA provenance for a deterministic git archive of this commit.
# Provenance level 3: https://slsa.dev/spec/v0.1/requirements
# Generator: https://github.com/slsa-framework/slsa-github-generator
# Verifier: https://github.com/slsa-framework/slsa-verifier

name: SLSA generic generator
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # upload-artifact
    outputs:
      # Must match the GITHUB_OUTPUT key written by steps.hash (hashes, not digests).
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # git archive is deterministic for this commit and includes only tracked files.
      - name: Build source artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          short="${GITHUB_SHA::8}"
          git archive --format=tar.gz \
            --prefix="vaultmax-${short}/" \
            -o "dist/vaultmax-${short}.tar.gz" HEAD

      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          cd dist
          # Key name MUST be hashes. One line: "<sha256>  <filename>".
          echo "hashes=$(sha256sum -- * | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: vaultmax-dist
          path: dist/*
          if-no-files-found: error

  provenance:
    needs: [build]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    # Full semver required. @v2 is not a ref; v2.1.0 is the latest release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      # Only upload release assets on tag/release runs; avoids dispatch failures
      # that require upload-tag-name when not on a tag ref.
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}
      # Private repo opt-in. Publishes repo name, ref, and subject names to public Rekor.
      private-repository: true
